name: android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 生成 android 目录并设置中文名
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android \
              --org com.xiaoman --project-name xiaoman .scaffold
            cp -r .scaffold/android ./android
            rm -rf .scaffold
          fi
          sed -i 's/android:label="xiaoman"/android:label="小满"/' \
            android/app/src/main/AndroidManifest.xml
          if [ -d assets/icon/res ]; then
            cp -r assets/icon/res/. android/app/src/main/res/
          fi
          - name: 设置安装权限
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.INTERNET" />',
                         s, count=1)
              p.write_text(s)
          s = p.read_text()
          if 'REQUEST_INSTALL_PACKAGES' not in s:
              s = re.sub(r'(<manifest[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />',
                         s, count=1)
              p.write_text(s)
          PY
      - run: flutter pub get

      - name: flutter analyze
        continue-on-error: true
        run: flutter analyze

      - name: flutter test
        continue-on-error: true
        run: flutter test

      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: xiaoman-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90
